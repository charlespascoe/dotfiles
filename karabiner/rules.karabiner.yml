rules:
  - desc: 'Command-L to Lock'
    from:
      key_code: l
      modifiers: [command]
    to:
      key_code: q
      modifiers: [command, control]

  - desc: 'Change Shift+Delete to Delete'
    from:
      key_code: delete_or_backspace
      modifiers: [shift]
    to:
      key_code: delete_or_backspace

  - desc: 'Change Ctrl-. to Ctrl-z in Alacritty/Ghostty'
    from:
      key_code: period
      modifiers: [control]
    to:
      key_code: z
      modifiers: [control]
    conditions:
      frontmost_application_if: ['^org\.alacritty$', '^com\.mitchellh\.ghostty$']

  - desc: 'Change Ctrl-z to No-op in Alacritty/Ghostty'
    from:
      key_code: z
      modifiers: [control]
    to:
      key_code: vk_none
    conditions:
      frontmost_application_if: ['^org\.alacritty$', '^com\.mitchellh\.ghostty$']

  - desc: 'Map Command-D to Ctrl-D for dictation in Vim'
    from:
      key_code: d
      modifiers: [command]
    to:
      key_code: d
      modifiers: [left_control]
    conditions:
      frontmost_application_if: ['^org\.alacritty$', '^com\.mitchellh\.ghostty$']

  - desc: 'Map Command-Up to Command-Plus'
    from:
      key_code: up_arrow
      modifiers: [command]
    to:
      key_code: keypad_plus
      modifiers: [command]

  - desc: 'Map Command-Down to Command-Minus'
    from:
      key_code: down_arrow
      modifiers: [command]
    to:
      key_code: keypad_hyphen
      modifiers: [command]

  # - desc: 'Map Command-` to Command-Tab'
  #   from:
  #     key_code: grave_accent_and_tilde
  #     modifiers: [command]
  #   to:
  #     key_code: tab
  #     modifiers: [left_command]

  - desc: 'Map Option-# to Option-3'
    from:
      key_code: '3'
      modifiers: [shift, option]
    to:
      key_code: '3'
      modifiers: [option]

  - desc: 'Map Command-E to Escape in Alacritty/Ghostty'
    from:
      key_code: e
      modifiers: [command]
    to:
      key_code: escape
    conditions:
      frontmost_application_if: ['^org\.alacritty$', '^com\.mitchellh\.ghostty$']

  - desc: 'Map Alt-I to Ctrl-y in Terminal (for snippets)'
    from:
      key_code: i
      modifiers: [option]
    to:
      key_code: y
      modifiers: [left_control]
    conditions:
      frontmost_application_if: ['^org\.alacritty$', '^com\.mitchellh\.ghostty$']

  - desc: 'Map F19 to Alt-Space for Serenade'
    from:
      key_code: f19
    to:
      key_code: spacebar
      modifiers: [option]

  - desc: 'Map End to Ctrl-E'
    from:
      key_code: end
      modifiers: []
    to:
      key_code: e
      modifiers: [control]
    conditions:
      frontmost_application_unless: ['^org\.alacritty$', '^com\.mitchellh\.ghostty$', '^com\.microsoft\..*$']

  - desc: 'Map Tab to Cmd-] in Drafts'
    from:
      key_code: tab
      modifiers: []
    to:
      key_code: close_bracket
      modifiers: [command]
    conditions:
      frontmost_application_if: ['^com\.agiletortoise\.Drafts-OSX$']

  - desc: 'Map Shift-Tab to Cmd-[ in Drafts'
    from:
      key_code: tab
      modifiers: [shift]
    to:
      key_code: open_bracket
      modifiers: [command]
    conditions:
      frontmost_application_if: ['^com\.agiletortoise\.Drafts-OSX$']

  - desc: 'Disable Command-R in ChatWise'
    from:
      key_code: r
      modifiers: [command]
    to:
      key_code: vk_none
    conditions:
      frontmost_application_if: ['^app\.chatwise$']

  - desc: 'Map Command-Shift-R to Command-R in ChatWise'
    from:
      key_code: r
      modifiers: [command, shift]
    to:
      key_code: r
      modifiers: [command]
    conditions:
      frontmost_application_if: ['^app\.chatwise$']
