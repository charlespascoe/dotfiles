set -g default-terminal "xterm-256color"

set-option -g update-environment "SSH_CLIENT SSH_TTY"

# Fix issues with italic; setting terminfo would also work, but it's easer to
# just put it here
set -as terminal-overrides ',*:sitm=\E[3m:ritm=\E[23m'

# Enable extra underline settings (e.g. undercurl), 24-bit RGB colour support,
# and extended keys (CSI u) so Shift+Enter etc. are distinguishable
set-option -g terminal-features[3] "*:usstyle"
set-option -g terminal-features[4] "*:RGB"
set-option -g terminal-features[5] "*:extkeys"

# Send modified key sequences unconditionally (not just when the app requests them)
set -g extended-keys always
set -g extended-keys-format csi-u


set-option -g default-shell /bin/zsh

# Increase History
set-option -g history-limit 50000

# Start at 1
set-option -g base-index 1

# Fix Escape (for vim)
set -sg escape-time 0

# Renumber windows when a window is closed
set-option -g renumber-windows on

# Disable auto rename
set-window-option -g automatic-rename on

# Mouse
set-option -g mouse on

set -g focus-events on

bind-key -n MouseDrag1Status swap-window -d -t=

# Remap prefix to Control + z
unbind C-b
set -g prefix C-z
bind C-z last-pane

# Force a reload of the config file
unbind r
bind r source-file ~/.tmux.conf

# Copy Mode
set-window-option -g mode-keys vi
bind Escape copy-mode
unbind p
bind p paste-buffer

# Improve scrolling
#bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M; send-keys -M; send-keys -M; send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M; send-keys -M; send-keys -M; send-keys -M' 'copy-mode -e; send-keys -M; send-keys -M; send-keys -M; send-keys -M'"
#bind -n WheelDownPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M; send-keys -M; send-keys -M; send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M; send-keys -M; send-keys -M; send-keys -M' 'copy-mode -e; send-keys -M; send-keys -M; send-keys -M; send-keys -M'"

# Resize panes
unbind z
bind z resize-pane -Z

# Pane management
bind | split-window -h  -c "#{pane_current_path}"
bind \\ split-window -c "#{pane_current_path}"

# Window navigation
# unbind n
# bind n command-prompt "rename-window '%%'"
unbind c
bind c new-window -a -c "#{pane_current_path}"
bind C-c new-window -a -c "#{pane_current_path}"
bind Tab last-window
bind -n C-M-Right next-window
bind -n C-M-Left previous-window

# Session navigation
bind C-l switch-client -l
# Z = zoom (full screen), N = no preview, s = collapse all but sessions, O = sort order
bind s choose-tree -ZNs -O time


# Moving windows
# bind-key m command-prompt -p "move window to:" "swap-window -t '%%'"
bind-key -r < swap-window -d -t -1
bind-key -r > swap-window -d -t +1

# Decoration

# set-option -g status-fg '#f8f8f2'
# set-option -g status-bg 'default'
set-option -g status-style 'bg=default,fg=default'
# set-option -gu status-bg
set-option -g status-justify left
# set-option -g status-left '#[fg=#BD93F9,bg=#343746]#[bg=#BD93F9,fg=#21222C,bold]#S#[nobold,fg=#BD93F9,bg=#343746] '
set-option -g status-left '#[bg=#BD93F9,fg=#21222C,bold] #S#[nobold,fg=#BD93F9,bg=default] '
set-option -g status-left-length 32
set-option -g status-right-length 64
set-option -g status-right ' #[fg=#BD93F9]#[bg=#BD93F9,fg=#21222C]#(date "+%a %Y/%m/%d %H:%M") '
set-option -g status-interval 1

set -g pane-active-border-style fg='#6272A4'
set -g pane-border-style fg='#6272A4'
set -g window-style bg='#282a36'
set -g window-active-style bg='#23242e'
set -g window-status-separator ' '
set -g window-status-bell-style 'reverse'

# Remap flag chars to Nerd Font icons (note the spaces after the symbols)
set -g @flag_fmt "#(printf '%%s' '#F' | sed -E -e 's/[*-]//g' -e 's/Z/ /' -e 's/!/󰂞 /' -e 's/^./ &/')"

# A recent tmux update broke commas in conditionals, e.g. #{?cond,true,false},
# especially if the true/false expressions contained comma-separated formats,
# e.g. #[fg=#f8f8f8,nobold,italics].
# NOTE: the window_bell_flag conditional is used to fix a visual issue due to
# using 'reverse' as the bell style, which causes the chevron to appear as a
# dark block without the conditional.
set-window-option -g window-status-format "#[fg=#4A567F,bg=default]#[bg=#4A567F,fg=#f8f8f8]#W#{E:@flag_fmt}#[#{?window_bell_flag,fg=#f8f8f8,fg=#4A567F},bg=#333E61]#[italics]#[fg=#f8f8f8] #T#[noitalics,fg=#3A4464,bg=default]"
set-window-option -g window-status-current-format "#[fg=#BD93F9,bg=default]#[bg=#BD93F9,fg=#21222C,bold]#W#{E:@flag_fmt}#{?#{==:#{host},#T},#[nobold]#[fg=#BD93F9]#[bg=default],#[fg=#BD93F9]#[bg=#774DB4] #[fg=#f8f8f8]#[nobold]#[italics]#T#[noitalics]#[fg=#774DB4]#[bg=default]}"

# Misc

bind -n C-h send-keys C-w

## Switch between the current session and the Draft session
bind -n M-d if-shell -F '#{==:#{session_name},draft}' 'switch-client -l' 'attach-session -t draft'

## Map PageUp/PageDown to No-op

bind -n PageUp send-keys
bind -n PageDown send-keys

## M-Left/Right -> Home/End

bind -n M-Left send-keys Home
bind -n M-Right send-keys End

## C-z h/j/k/l -> Navigate panes

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

## C-z H/J/K/L -> Swap current pane with the one left/below/above/right
## -d keeps focus on the current pane so it visibly "travels" with the swap
## (overrides tmux's default L -> switch-client -l; C-l still does that)
bind H swap-pane -d -t '{left-of}'
bind J swap-pane -d -t '{down-of}'
bind K swap-pane -d -t '{up-of}'
bind L swap-pane -d -t '{right-of}'

# Disable arrow key repeat

unbind Up
unbind Down
unbind Left
unbind Right

bind Up select-pane -U
bind Down select-pane -D
bind Left select-pane -L
bind Right select-pane -R

